[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-writing-rules"
version = "0.1.0.dev0"
description = "Shared Vale rules with source-string and baseline adapters"
requires-python = ">=3.11"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4", "docutils==0.23"]

[project.scripts]
writing-rules = "writing_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
writing_rules = ["assets/.vale.ini", "assets/**/*"]
